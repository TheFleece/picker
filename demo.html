<!DOCTYPE html>
<html lang="en">
<head>
<!--
  PICKER — Enterprise demo (DB-feed vision, no OCR / no API / no keys)
  ====================================================================
  A safe, self-contained demonstration of how Picker works once orders
  come straight from the company system instead of paper.

  • Orders arrive from the warehouse system as a FIFO queue. The picker
    is handed the NEXT order in line — no cherry-picking the big ones.
  • Each spot: one tap = TAKEN. Took less than planned? One tap, type
    the real number — the exact shortfall is captured on the spot.
  • Clock-in / clock-out: the start time is logged when the shift begins,
    the end time when it finishes — the shift length is computed for you.
  • Hands-free, voice guidance and an eco screen are real product
    features, here as OFF-by-default toggles (no microphone is ever used).
  • A live shift log totals every order and zero, and shows progress
    to the next bonus step.
  • An office view shows the same data the way the office would see it.
    All data stays inside Netto.

  Enterprise-safe: no camera, no external API, no keys, no microphone,
  no installation. Runs on any phone, offline. Sample data only.

  The headline order is the real SPOT CHILLED list — Wave 2, Store 7810,
  18 lines, 105 colli. The rest of the queue is synthesized fresh on every
  demo start by data/warehouse-generator.js, which recombines real building
  blocks (brands, product types, sizes from data/nomenclature-parts.js) into
  a big warehouse — restarting the demo rebuilds it. If the data/ scripts
  are absent (standalone copy of this file), a static seed is used instead.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Picker Demo">
<meta name="theme-color" content="#0b0f14">
<title>Picker — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14;--bg-2:#0e141b;--card:#141a22;--card-2:#1b2430;
  --line:#243040;--line-2:#33445a;
  --txt:#e8eef5;--muted:#8fa1b3;--faint:#62748a;
  --go:#2dd46f;--go-deep:#1f9d51;--go-press:#24b35d;
  --amber:#ffb020;--bad:#ff5d5d;--blue:#4aa3ff;
  --r:16px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{margin:0;overscroll-behavior:none;background:var(--bg);}
input,textarea{-webkit-user-select:text;user-select:text;}
body{
  color:var(--txt);-webkit-user-select:none;user-select:none;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100svh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 85% -12%, rgba(45,212,111,.09), transparent 60%),
    radial-gradient(900px 600px at 2% 0%, rgba(255,176,32,.05), transparent 55%);
}
h1,h2,h3,.brand-nm,.num,.big,.eyebrow{font-family:'Space Grotesk','Inter',system-ui,sans-serif;}
.num{font-variant-numeric:tabular-nums;}
a{color:var(--muted);}
svg.ic{display:block;flex:none;}

.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;
  padding:14px 16px calc(28px + env(safe-area-inset-bottom));}
.screen{display:none;animation:fade .35s var(--ease);}
.screen.on{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:11px;margin-bottom:16px;}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,var(--go),var(--go-deep));color:#06250f;
  font-family:'Space Grotesk';font-weight:700;font-size:22px;
  box-shadow:0 6px 18px -6px rgba(45,212,111,.55);}
.logo.sm{width:26px;height:26px;font-size:15px;border-radius:8px;}
.brand-nm{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:-.01em;}
.top .who{flex:1;min-width:0;}
.top .who .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top .who .conn{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:1px;}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px rgba(45,212,111,.18);
  animation:blink 2.4s infinite;flex:none;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.iconbtn{flex:none;width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .08s ease,color .15s;}
.iconbtn:active{transform:scale(.93);}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;}
.lang button{padding:7px 9px;background:none;border:none;color:var(--faint);font-size:12px;font-weight:700;letter-spacing:.4px;font-family:inherit;cursor:pointer;}
.lang button.on{background:#1d2a3a;color:var(--txt);}
.lang button+button{border-left:1px solid var(--line);}

.demobadge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--amber);background:rgba(255,176,32,.10);
  border:1px solid rgba(255,176,32,.28);border-radius:999px;padding:5px 11px;}
.demobadge .dotlive{background:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.18);}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--go);}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--go);border-radius:2px;}
.eyebrow.amber{color:var(--amber);}.eyebrow.amber::before{background:var(--amber);}

h2.scr{font-size:23px;line-height:1.12;letter-spacing:-.015em;margin:11px 0 4px;font-weight:700;}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px;}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:1px solid var(--line);
  border-radius:14px;padding:15px;font-size:16px;font-weight:600;color:var(--txt);background:var(--card);
  margin-top:10px;font-family:inherit;transition:transform .08s ease,background .15s;cursor:pointer;}
.btn:active{transform:scale(.975);}
.btn:disabled{opacity:.34;}
.btn-go{background:var(--go);color:#06250f;border:none;font-size:20px;padding:18px;font-family:'Space Grotesk';font-weight:700;}
.btn-go:active{background:var(--go-press);}
.btn-amber{background:#251809;border-color:var(--amber);color:var(--amber);}
.btn-ghost{background:transparent;}
.btn-small{padding:11px;font-size:14px;font-weight:500;color:var(--muted);}
.row{display:flex;gap:10px;}.row .btn{flex:1;margin-top:10px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;}
.card+.card{margin-top:12px;}

/* ---------- login ---------- */
.field{margin-top:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
.field input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;color:var(--txt);
  font-size:16px;padding:13px;font-family:inherit;}
.field input:focus{outline:none;border-color:var(--go);}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line);}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--muted);}.kv .k small{display:block;font-size:11px;color:var(--faint);text-transform:none;letter-spacing:0;margin-top:1px;}
.kv .v{font-weight:600;text-align:right;}
.loginhero{text-align:center;padding:6px 0 2px;}
.loginhero .logo{margin:0 auto 14px;width:54px;height:54px;font-size:30px;border-radius:15px;}
.loginhero h1{font-size:30px;margin:0;letter-spacing:-.02em;}
.loginhero .tag{color:var(--muted);font-size:14.5px;margin:8px auto 0;max-width:30ch;}
.clockhint{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--faint);font-size:12.5px;margin-top:12px;}
.clockhint svg{color:var(--go);}

/* ---------- queue ---------- */
.qhead{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--faint);margin:4px 2px 10px;}
.tix{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;background:var(--card);margin-bottom:9px;}
.tix .tn{flex:none;width:42px;height:42px;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--muted);line-height:1;text-align:center;}
.tix .tn small{display:block;font-size:8.5px;letter-spacing:.06em;color:var(--faint);font-weight:600;}
.tix .ti{flex:1;min-width:0;}
.tix .ti .o{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.tix .ti .m{font-size:12.5px;color:var(--muted);margin-top:2px;}
.tix .ts{flex:none;font-size:11.5px;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap;}
.tix.next{border-color:var(--go);background:rgba(45,212,111,.07);}
.tix.next .tn{background:rgba(45,212,111,.14);border-color:transparent;color:var(--go);}
.tix.next .ts{color:var(--go);}
.tix.dim{opacity:.5;}
.smallflag{display:inline-block;font-size:10px;font-weight:700;color:var(--amber);background:rgba(255,176,32,.12);
  border:1px solid rgba(255,176,32,.25);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;}
.feednote{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--go);
  background:linear-gradient(160deg,rgba(45,212,111,.05),transparent);border-radius:0 12px 12px 0;
  padding:11px 14px;font-size:13px;color:var(--muted);line-height:1.45;margin:2px 0 16px;}
.feednote b{color:var(--txt);font-weight:600;}
.feednote svg{color:var(--go);margin-top:1px;}
.resume{display:flex;align-items:center;gap:12px;border:1px solid var(--go);background:rgba(45,212,111,.08);
  border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer;}
.resume .ri{flex:1;min-width:0;}
.resume .ri .o{font-family:'Space Grotesk';font-weight:700;font-size:14px;}
.resume .ri .m{font-size:12px;color:var(--muted);margin-top:1px;}
.resume svg{color:var(--go);}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;}
.seg button{flex:1;padding:9px 6px;border:none;background:none;color:var(--muted);font-family:inherit;font-weight:600;
  font-size:13.5px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s;}
.seg button.on{background:#1d2a3a;color:var(--txt);}
.seg button .sgt{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;}
.seg button.on .sgt{color:var(--go);}
.sheet{display:flex;align-items:center;gap:12px;border:1px dashed var(--line-2);border-radius:12px;
  padding:12px 14px;background:var(--bg-2);margin-bottom:8px;cursor:pointer;transition:transform .08s ease,border-color .15s;}
.sheet:active{transform:scale(.99);}
.sheet:hover{border-color:var(--go);}
.sheet .si{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--card);color:var(--muted);}
.sheet .sb{flex:1;min-width:0;}
.sheet .sb .o{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.sheet .sb .m{font-size:12px;color:var(--muted);margin-top:1px;}
.sheet .sc{flex:none;color:var(--go);}

/* ---------- work ---------- */
body.working{background:#000;}
.workbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-bottom:12px;}
.workbar .mid{color:var(--go);font-weight:600;font-family:'Space Grotesk';text-align:center;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 18px 22px;text-align:center;}
.locbig{font-family:'Space Grotesk';font-weight:700;font-size:clamp(40px,13vw,58px);line-height:.95;letter-spacing:.5px;
  color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}
.locbig .locsep{font-style:normal;color:#2e3946;margin:0 .06em;}
.wsep{width:54px;height:5px;border-radius:3px;background:#2e3946;margin:14px auto;}
.qtybig{font-family:'Space Grotesk';font-weight:700;color:var(--go);font-size:clamp(34px,10vw,44px);line-height:1.02;}
.qtybig .u{font-size:.5em;color:var(--muted);font-weight:600;margin-left:.15em;}
.qtybig .orig{display:block;color:var(--faint);text-decoration:line-through;font-size:.6em;font-weight:700;}
.qtybig .act{display:block;color:var(--bad);}
.wdesc{color:var(--muted);font-size:15px;margin-top:12px;line-height:1.35;}
.wart{color:var(--faint);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums;}
.wnext{color:#46586c;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums;}
.pbar{display:none;align-items:center;gap:10px;margin-top:12px;background:#251809;border:1px solid var(--amber);border-radius:14px;padding:10px 12px;}
.pbar.on{display:flex;}
.pbar .lab{color:var(--amber);font-size:15px;font-weight:700;flex:none;}
.pbar input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--amber);border-radius:10px;color:#fff;
  font-size:24px;font-weight:800;text-align:center;padding:9px;font-variant-numeric:tabular-nums;}
.pbar .ok{flex:none;width:56px;background:var(--go);border:none;border-radius:10px;color:#06250f;padding:11px 0;cursor:pointer;display:grid;place-items:center;}
.pbar .x{flex:none;width:48px;background:#1a2230;border:1px solid var(--line);border-radius:10px;color:var(--muted);padding:12px 0;cursor:pointer;display:grid;place-items:center;}
.whint{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center;font-size:12px;color:#3f5165;margin-top:12px;line-height:1.4;}
.whint svg{color:#516579;}

/* ---------- done ---------- */
.doneic{display:flex;justify-content:center;margin:6px 0 2px;}
.doneic svg{color:var(--go);}
.bigstat{text-align:center;}
.bigstat .n{font-family:'Space Grotesk';font-weight:700;font-size:52px;color:var(--go);line-height:1;}
.bigstat .l{color:var(--muted);font-size:13px;margin-top:6px;}

/* ---------- shift log ---------- */
.shiftmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;color:var(--muted);}
.shiftmeta svg{color:var(--go);}
.shiftmeta b{color:var(--txt);font-weight:600;}
.jtot{font-family:'Space Grotesk';font-weight:700;color:var(--go);font-size:54px;line-height:1;}
.jtotl{color:var(--muted);font-size:13px;margin-top:3px;}
.jpace{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:rgba(255,176,32,.12);color:var(--amber);
  font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:8px;}
.prog{margin-top:14px;}
.prog .track{height:9px;border-radius:5px;background:#1b2430;overflow:hidden;}
.prog .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--go),var(--amber));transition:width .5s var(--ease);}
.prog .pl{margin-top:6px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;}
.jrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;}
.jrow:last-child{border-bottom:0;}
.jrow .jl{color:var(--muted);}
.jrow .jl b{color:var(--txt);font-weight:600;}
.jrow .jv{font-weight:700;font-variant-numeric:tabular-nums;}
.jrow .zero{color:var(--amber);font-size:12px;font-weight:600;}
.clockedout{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13.5px;
  margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px;}
.clockedout svg{color:var(--go);}

/* ---------- office ---------- */
.pkbar{margin:11px 0;}
.pkbar .pkh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;}
.pkbar .pkh .me{color:var(--go);font-weight:700;}
.pkbar .pkh .v{font-weight:700;font-variant-numeric:tabular-nums;}
.pkbar .track{height:10px;border-radius:5px;background:#1b2430;overflow:hidden;}
.pkbar .fill{height:100%;border-radius:5px;background:var(--blue);}
.pkbar.me .fill{background:linear-gradient(90deg,var(--go),var(--go-deep));}
.wave{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.wave:last-child{border-bottom:0;}
.wave .wd{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted);}
.wave.done .wd{background:var(--go);}.wave.doing .wd{background:var(--amber);}.wave.wait .wd{background:#3a4757;}
.wave .wn{font-family:'Space Grotesk';font-weight:700;font-size:15px;flex:1;}
.wave .wst{font-size:12.5px;color:var(--muted);}
.wave.done .wst{color:var(--go);}.wave.doing .wst{color:var(--amber);}
.shortrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.shortrow:last-child{border-bottom:0;}
.shortrow .sd{color:var(--muted);min-width:0;}
.shortrow .sd b{color:var(--txt);font-weight:600;}
.shortrow .sq{flex:none;font-variant-numeric:tabular-nums;font-weight:700;}
.shortrow .sq .from{color:var(--faint);text-decoration:line-through;font-weight:600;margin-right:5px;}
.shortrow .sq .to{color:var(--bad);}
.empty{color:var(--faint);font-size:13.5px;text-align:center;padding:14px 0;}
.lock{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin-top:14px;
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;line-height:1.4;}
.lock svg{flex:none;color:var(--go);margin-top:1px;}

.sectitle{font-family:'Space Grotesk';font-weight:600;font-size:14px;color:var(--txt);margin:0 0 4px;display:flex;align-items:center;gap:8px;}
.sectitle svg{color:var(--go);}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:22px;line-height:1.5;}

/* ---------- overlays ---------- */
#paused{position:fixed;inset:0;z-index:80;background:rgba(5,8,11,.96);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;}
#paused.on{display:flex;}
#paused .pi{color:var(--muted);}
#paused h2{font-size:24px;margin:0;}
#paused p{color:var(--muted);margin:0;}

#eco{position:fixed;inset:0;z-index:85;background:#000;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;text-align:center;padding:24px;}
#eco.on{display:flex;}
#eco .em{position:absolute;top:18px;right:20px;color:#33414f;}
#eco .e1{color:#39434f;font-family:'Space Grotesk';font-weight:700;font-size:54px;font-variant-numeric:tabular-nums;white-space:nowrap;}
#eco .e2{color:#2c473a;font-family:'Space Grotesk';font-weight:700;font-size:42px;}
#eco .ed{color:#44505c;font-size:18px;font-weight:600;max-width:92%;line-height:1.3;margin-top:6px;word-break:break-word;}
#eco .eart{color:#36424e;font-size:15px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;}
#eco .e3{color:#23292f;font-size:13px;margin-top:22px;}

#sheetBack{position:fixed;inset:0;z-index:89;background:rgba(3,6,9,.55);opacity:0;pointer-events:none;transition:opacity .3s;}
#sheetBack.on{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:720px;margin:0 auto;
  background:var(--bg-2);border-top:1px solid var(--line-2);border-radius:20px 20px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(115%);transition:transform .3s var(--ease);}
#sheet.on{transform:none;}
.sheeth{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.sheeth h3{font-size:18px;margin:0;font-family:'Space Grotesk';}
.setrow{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.setrow:last-child{border-bottom:0;}
.setic{flex:none;width:34px;height:34px;border-radius:9px;background:var(--card);display:grid;place-items:center;color:var(--go);}
.setmain{flex:1;min-width:0;}
.setlab{font-weight:600;font-size:15px;}
.sethint{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4;}
.sw{flex:none;width:46px;height:28px;border-radius:999px;background:#26323f;border:1px solid var(--line-2);position:relative;cursor:pointer;transition:background .2s,border-color .2s;margin-top:2px;}
.sw .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#7d8ea0;transition:transform .2s,background .2s;}
.sw.on{background:rgba(45,212,111,.25);border-color:var(--go);}
.sw.on .knob{transform:translateX(18px);background:var(--go);}
.safenote{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11.5px;margin-top:12px;line-height:1.4;}
.safenote svg{color:var(--go);flex:none;}

@media (max-width:420px){
  .wrap{padding:12px 13px calc(24px + env(safe-area-inset-bottom));}
  h2.scr{font-size:21px;}

/* ============================================================
   LIVE DATA — a fresh synthetic warehouse on every demo start.
   data/warehouse-generator.js recombines real building blocks
   (data/nomenclature-parts.js) on top of the transcribed real
   catalog (data/catalog-*.js) into thousands of SKUs, then the
   queue is generated from it. Restarting the demo rebuilds the
   warehouse. Without those scripts the static seed above wins.
   ============================================================ */
const REAL_CHILLED = (typeof CATALOG_CHILLED_A!=="undefined"?CATALOG_CHILLED_A:[])
  .concat(typeof CATALOG_CHILLED_B!=="undefined"?CATALOG_CHILLED_B:[]);
const REAL_DRY = typeof CATALOG_DRY!=="undefined"?CATALOG_DRY:[];
const GEN_OK = typeof buildWarehouse==="function" && typeof CONFIG!=="undefined"
  && typeof REAL_STORES!=="undefined" && REAL_CHILLED.length>0;

const deepCopy = o => JSON.parse(JSON.stringify(o));
// UI shows the short category name; the generator emits the full sheet header.
function tidyOrder(o){ o.dept=o.dept.replace(/\s*-\s*NEW PALLET/,""); delete o.total; return o; }
// The "small" badge needs one truly small order (≤12 colli) in every queue.
function makeSmall(o){
  while(o.items.length>3 && colliSum(o.items)>12) o.items.pop();
  let guard=0;
  while(colliSum(o.items)>12 && guard++<200){
    const it=o.items.find(x=>x.qty>1); if(!it)break; it.qty--;
  }
  return o;
}
// Nudge an order's colli into a range — keeps demo numbers on the scale the
// demo has always shown (queue ≈ up to ~150, finished big order ~300-400)
// instead of the generator's occasional 500+ outliers.
function makeAbout(o, min, max){
  while(o.items.length>4 && colliSum(o.items)>max) o.items.pop();
  let guard=0;
  while(colliSum(o.items)>max && guard++<400){
    const it=o.items.find(x=>x.qty>1); if(!it)break; it.qty--;
  }
  guard=0; let i=0;
  while(colliSum(o.items)<min && guard++<2000){
    const it=o.items[i++ % o.items.length]; if(it.qty<95) it.qty++;
  }
  return o;
}
function toDone(o, shortfall){
  const planned=colliSum(o.items);
  const shorts=shortfall?[shortfall]:[];
  const colli=planned - shorts.reduce((s,x)=>s+(x.planned-x.actual),0);
  return {wave:o.wave, store:o.store, dept:o.dept, colli, planned, orders:1, items:o.items.length, shortfalls:shorts};
}
function pickShortfall(o){
  const it=o.items.find(x=>x.qty>=3)||o.items[0];
  const actual=Math.max(0, it.qty-(1+Math.floor(Math.random()*Math.min(4,it.qty))));
  return {loc:it.loc, desc:it.desc, planned:it.qty, actual, store:o.store};
}

function buildDemoData(){
  if(!GEN_OK) return { orders: deepCopy(QUEUE_SEED), done: deepCopy(DONE_SEED) };
  const wh = buildWarehouse(CONFIG, REAL_CHILLED, REAL_DRY);
  // The headline sheet is shown verbatim — keep its articles and shelf
  // locations out of the generated orders so no two orders contradict.
  const realLocs=new Set(REAL_ITEMS.map(i=>i.loc)), realArts=new Set(REAL_ITEMS.map(i=>i.art));
  const pool={ slots: wh.slots.filter(s=>!realLocs.has(s.loc)&&!realArts.has(s.article)), dryPool: wh.dryPool };
  resetOrderSeq();
  // Store numbers for the rotating orders come from a large synthetic pool
  // (same approach as order-database.html) so every demo run spreads across
  // a different set of stores instead of cycling the same handful. 7810
  // stays reserved for the headline pair above (real CHILLED + DRY sheet).
  const synthPool = buildSyntheticStores(rnd(30,60), REAL_STORES.concat(EXTRA_STORES)).filter(s=>s!=="7810");
  const others=shuffleArr(synthPool).slice(0,4);
  const st=i=>others[i%others.length];
  const orders=[
    // the real photographed list — always the headline
    {id:"o7810c", wave:2, store:"7810", dept:"SPOT CHILLED", items:deepCopy(REAL_ITEMS)},
    // same store, second sheet — why a sheet is identified by Store + Colli
    tidyOrder(generateOrder(pool, CONFIG, 2, "7810", "dry")),
    tidyOrder(makeAbout(generateOrder(pool, CONFIG, 2, st(0), "chilled", "medium"), 60, 150)),
    tidyOrder(makeSmall(generateOrder(pool, CONFIG, 2, st(1), "chilled", "small"))),
    // one future-wave order — stays dimmed until wave 2 is done
    tidyOrder(makeAbout(generateOrder(pool, CONFIG, 3, st(2), "chilled", "medium"), 60, 150))
  ];
  // shift log seed: two wave-1 orders finished earlier, one with a shortfall.
  // d1 lands at 260-420 colli so the demo picker leads the office board
  // (teammates sit at 243/176) with bonus progress still visibly unfinished.
  const d1=tidyOrder(makeAbout(generateOrder(pool, CONFIG, 1, st(3), "chilled", "medium"), 260, 420));
  const d2=tidyOrder(generateOrder(pool, CONFIG, 1, st(0), "dry"));
  return { orders, done:[toDone(d1,null), toDone(d2,pickShortfall(d2))] };
}

    done:data.done,

}
function load(){
  try{ localStorage.removeItem("picker_demo_state_v3"); }catch(e){}   // stale pre-generator schema
  try{ const r=localStorage.getItem(LS); if(r){ S=JSON.parse(r); if(S&&S.queue&&S.settings&&S.orders) return; } }catch(e){}
  S=freshState();
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function resetDemo(){ S=freshState(); save(); document.body.classList.remove("working"); show("login"); }

const order = id => S.orders.find(o=>o.id===id);
const shortDept = d => /dry|odd/i.test(d||"") ? "DRY" : "CHILLED";
function findPending(butik, coli){
  return S.queue.map(order).find(o=>o.store===String(butik).trim() && colliSum(o.items)===coli) || null;
}
function t(k){ return (I18N[S.lang]&&I18N[S.lang][k]) || I18N.en[k] || k; }
function tpl(k,v){ let s=t(k); for(const p in v) s=s.replace("{"+p+"}", v[p]); return s; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const inWork = () => S.screen==="work";
const curItem = () => S.cur ? order(S.cur.orderId).items[S.cur.idx] : null;

// live shift totals
function shiftColli(){ return S.done.reduce((s,d)=>s+d.colli,0); }
function shiftOrders(){ return S.done.reduce((s,d)=>s+(d.orders||1),0); }
function allShortfalls(){ const a=[]; S.done.forEach(d=>(d.shortfalls||[]).forEach(s=>a.push({...s,store:s.store||d.store}))); return a; }
function minPendingWave(){ return S.queue.length? Math.min(...S.queue.map(id=>order(id).wave)) : 0; }

function fmtTime(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtDur(ms){ const m=Math.max(0,Math.round(ms/60000)); const h=Math.floor(m/60); return h>0?(h+"h "+(m%60)+"m"):(m+"m"); }

/* ============================================================
   AUDIO — beeps + AirPods (MediaSession) + voice (TTS)
   No microphone is ever requested. Everything is local.
   ============================================================ */
let actx=null;
function ensureAudio(){
  try{
    if(actx&&actx.state==="closed")actx=null;
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state!=="running")actx.resume().catch(()=>{});
  }catch(e){}
}
function beep(freq,ms,vol){
  try{
    if(!actx||actx.state==="closed"){ensureAudio();if(!actx)return;}
    if(actx.state!=="running")actx.resume().catch(()=>{});
    const tt=actx.currentTime+0.005;
    const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(vol||0.12,tt);
    g.gain.exponentialRampToValueAtTime(0.001,tt+ms/1000);
    o.start(tt);o.stop(tt+ms/1000+0.02);
  }catch(e){}
}
function beepTake(){beep(660,55);setTimeout(()=>beep(990,80),70);}
function beepBack(){beep(520,55);setTimeout(()=>beep(390,80),70);}
function clickTick(){beep(1500,16,0.04);}

/* ---- voice (TTS) + autorepeat ---- */
let voices=[];
function loadVoices(){ try{ voices=window.speechSynthesis?speechSynthesis.getVoices()||[]:[]; }catch(e){ voices=[]; } }
if(window.speechSynthesis){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }
function voiceFor(){
  const pre={en:"en",da:"da",uk:"uk"}[S.lang]||"en";
  let v=voices.find(x=>new RegExp("^"+pre,"i").test(x.lang));
  if(!v&&pre==="uk")v=voices.find(x=>/^ru/i.test(x.lang));
  const code={en:"en-US",da:"da-DK",uk:"uk-UA"}[S.lang]||"en-US";
  return {voice:v||null, lang:(v&&v.lang)||code};
}
function cancelSpeech(){ try{ if(window.speechSynthesis)speechSynthesis.cancel(); }catch(e){} }
function speak(text){
  if(!window.speechSynthesis||!S.settings.voice)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=voiceFor(); if(v.voice)u.voice=v.voice; u.lang=v.lang; u.rate=1.05;
    setTimeout(()=>{ try{speechSynthesis.speak(u);}catch(e){} },50);
  }catch(e){}
}
function locSpeak(loc){ return String(loc).split("-").map(p=>p.split("").join(" ")).join(", "); }
function itemPhrase(it){ return tpl("ttsItem",{loc:locSpeak(it.loc), qty:it.qty}); }
let repeatTimer=null;
function scheduleRepeat(){
  clearTimeout(repeatTimer);
  if(!inWork()||paused||!S.settings.voice)return;
  if(pbarOpen())return;
  repeatTimer=setTimeout(sayItem,8000);
}
function sayItem(){
  if(!inWork()||paused)return;
  const it=curItem(); if(!it)return;
  if(S.settings.voice && !pbarOpen()) speak(itemPhrase(it));
  scheduleRepeat();
}

/* ---- AirPods via MediaSession (silent looping audio holds the session) ---- */
function silentWavURL(){
  const rate=8000,len=rate*2,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");v.setUint32(4,36+len*2,true);ws(8,"WAVE");ws(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);
  ws(36,"data");v.setUint32(40,len*2,true);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
let pod=null,podGuard=0,podIgnorePause=0;
function registerPodHandlers(){
  if(!("mediaSession"in navigator)||!pod)return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:"Picker"});
    navigator.mediaSession.playbackState="playing";
    navigator.mediaSession.setActionHandler("pause",()=>{stemAction("take");pod.play().catch(()=>{});});
    navigator.mediaSession.setActionHandler("play",()=>{stemAction("take");pod.play().catch(()=>{});});
    navigator.mediaSession.setActionHandler("nexttrack",()=>{stemAction("back");});
    navigator.mediaSession.setActionHandler("previoustrack",()=>{stemAction("third");});
  }catch(e){}
}
function stemAction(kind){
  if(!inWork())return;
  const now=Date.now(); if(now<podGuard)return; podGuard=now+300;
  if(kind==="third"){ if(paused)resumeWork(); else pauseWork(); return; }
  if(paused)return;
  if(kind==="take")doTake();
  else if(kind==="back")backItem();
}
async function podToggle(on){
  try{ if("audioSession"in navigator)navigator.audioSession.type="playback"; }catch(e){}
  if(on){
    if(!pod){
      pod=new Audio(silentWavURL());pod.loop=true;pod.volume=0.01;
      pod.addEventListener("pause",()=>{
        if(Date.now()<podIgnorePause)return;
        if(S.settings.pod)pod.play().catch(()=>{});
      });
    }
    try{ await pod.play(); }catch(e){ S.settings.pod=false; save(); renderSheet(); return; }
    registerPodHandlers();
    setTimeout(registerPodHandlers,800);
  }else if(pod){ podIgnorePause=Date.now()+1200; pod.pause(); }
}

/* ============================================================
   ACTIONS
   ============================================================ */
function startOrderById(id){
  if(!S.queue.includes(id))return false;
  if(!S.checkIn) S.checkIn=Date.now();   // safety: ensure clocked in
  if(S.checkOut) S.checkOut=null;        // picking again after End shift → back on shift
  S.cur={orderId:id, idx:0, taken:[]};
  save(); show("work"); keepAwake(); sayItem(); return true;
}
function takeNext(){
  if(S.queue.length===0)return;
  const minW=minPendingWave();
  const id = S.queue.find(x=>order(x).wave===minW) || S.queue[0];
  startOrderById(id);
}
// Pilot mode: open the exact paper list in hand by Store + Colli (the lists's id on the sheet).
function openListEntry(){
  const b=document.getElementById("butikInp"), c=document.getElementById("coliInp");
  const bv=(b&&b.value||"").trim(), cv=parseInt(c&&c.value,10);
  const o=(bv && !isNaN(cv)) ? findPending(bv,cv) : null;
  if(!o){ const e=document.getElementById("paperErr"); if(e){ e.textContent=t("notFound"); e.style.display="block"; } beep(300,140); return; }
  startOrderById(o.id);
}
function resumeOrder(){ if(!S.cur)return; show("work"); keepAwake(); sayItem(); }
function skipOrder(){
  if(S.skips<=0 || S.queue.length<2)return;
  const minW=minPendingWave();
  const idx=S.queue.findIndex(x=>order(x).wave===minW);
  if(idx<0)return;
  const [id]=S.queue.splice(idx,1);
  let ins=idx;
  while(ins<S.queue.length && order(S.queue[ins]).wave===minW){ ins++; if(ins>idx)break; }
  S.queue.splice(Math.min(ins,S.queue.length),0,id);
  S.skips--; save(); rQueue();
}
function doTake(){
  if(Date.now()<uiShield)return;
  if(pbarOpen()){
    const inp=document.getElementById("lessInp");
    const it=curItem();
    let v=parseInt(inp&&inp.value,10);
    if(isNaN(v))v=it.qty;
    v=Math.max(0,Math.min(it.qty,v));
    document.getElementById("pbar").classList.remove("on");
    takeItem(v);
  }else{
    takeItem(null);
  }
}
function takeItem(actual){
  const o=order(S.cur.orderId), it=o.items[S.cur.idx];
  S.cur.taken[S.cur.idx] = (actual==null? it.qty : Math.max(0,Math.min(it.qty,actual)));
  beepTake();
  if(S.cur.idx >= o.items.length-1){ finishOrder(); }
  else { S.cur.idx++; save(); rWork(); sayItem(); }
}
function backItem(){
  if(Date.now()<uiShield)return;
  if(S.cur.idx>0){ S.cur.idx--; S.cur.taken.pop(); beepBack(); save(); rWork(); sayItem(); }
}
function finishOrder(){
  const o=order(S.cur.orderId);
  const colli=S.cur.taken.reduce((s,x)=>s+x,0);
  const planned=colliSum(o.items);
  const shortfalls=[];
  o.items.forEach((it,k)=>{ const a=S.cur.taken[k]; if(a<it.qty) shortfalls.push({loc:it.loc,desc:it.desc,planned:it.qty,actual:a,store:o.store}); });
  S.done.push({wave:o.wave, store:o.store, dept:o.dept, colli, planned, orders:1, items:o.items.length, shortfalls});
  S.lastDone={wave:o.wave, store:o.store, dept:o.dept, colli, items:o.items.length, shortfalls};
  S.queue = S.queue.filter(id=>id!==o.id);
  S.cur=null; save();
  beep(880,80);setTimeout(()=>beep(1320,120),140);
  show("done");
}
function pauseWork(){
  paused=true; clearTimeout(repeatTimer); cancelSpeech(); hideEco();
  document.getElementById("paused").classList.add("on");
}
function resumeWork(){
  paused=false; document.getElementById("paused").classList.remove("on");
  lastTouch=Date.now(); sayItem();
}
function endShift(){
  if(!confirm(t("endConfirm")))return;
  S.checkOut=Date.now(); save(); rLog();
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const langB=e.target.closest("[data-lang]");
  if(langB){ S.lang=langB.getAttribute("data-lang"); save(); if(document.getElementById("sheet").classList.contains("on"))renderSheet(); show(S.screen); return; }

  const modeB=e.target.closest("[data-mode]");
  if(modeB){ S.mode=modeB.getAttribute("data-mode"); save(); clickTick(); rQueue(); return; }

  const chip=e.target.closest("[data-id]");
  if(chip && chip.getAttribute("data-act")==="open-chip"){ clickTick(); startOrderById(chip.getAttribute("data-id")); return; }

  const tg=e.target.closest("[data-toggle]");
  if(tg){ clickTick(); toggleSetting(tg.getAttribute("data-toggle")); return; }

  const el=e.target.closest("[data-act]");
  if(!el)return;
  const a=el.getAttribute("data-act");
  if(a!=="take"&&a!=="back") clickTick();
  switch(a){
    case "start": {
      const v=document.getElementById("nameInp");
      if(v && v.value.trim()) S.name=v.value.trim().slice(0,24);
      if(!S.checkIn) S.checkIn=Date.now();
      ensureAudio(); save(); show("queue"); break;
    }
    case "take-next": takeNext(); break;
    case "open-list": openListEntry(); break;
    case "resume": resumeOrder(); break;
    case "skip": skipOrder(); break;
    case "open-log": show("log"); break;
    case "open-office": show("office"); break;
    case "goto-queue": show("queue"); break;
    case "back-queue": show("queue"); break;
    case "take": doTake(); break;
    case "back": backItem(); break;
    case "less": {
      const pb=document.getElementById("pbar");
      if(pb){ pb.classList.add("on"); clearTimeout(repeatTimer);
        const inp=document.getElementById("lessInp");
        const it=curItem();
        if(inp){ inp.value=""; inp.placeholder=String(it.qty); beep(700,40);
          setTimeout(()=>{try{inp.focus();}catch(e){}},60);
          inp.oninput=()=>{ const val=parseInt(inp.value,10);
            if(!isNaN(val)) setLessQty(it.qty, Math.max(0,Math.min(it.qty,val))); }; }
      }
      break;
    }
    case "less-ok": doTake(); break;
    case "less-x": { const pb=document.getElementById("pbar"); if(pb)pb.classList.remove("on"); rWork(); scheduleRepeat(); break; }
    case "pause": pauseWork(); break;
    case "end-shift": endShift(); break;
    case "settings": openSheet(); break;
    case "sheet-close": closeSheet(); break;
    case "restart": closeSheet(); if(confirm(t("restartConfirm"))) resetDemo(); break;
  }
});

document.getElementById("paused").addEventListener("click", resumeWork);
document.getElementById("sheetBack").addEventListener("click", closeSheet);
document.getElementById("eco").addEventListener("click", e=>{
  e.preventDefault(); e.stopPropagation();
  hideEco(); uiShield=Date.now()+350; lastTouch=Date.now();
});

/* ============================================================
   INIT
   ============================================================ */
load();
if(S.screen==="work" && !S.cur) S.screen="queue";
if(S.screen==="done" && !S.lastDone) S.screen="queue";
show(S.screen||"login");
</script>
