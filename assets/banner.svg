<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd46f"/><stop offset="1" stop-color="#1f9d51"/>
    </linearGradient>
    <radialGradient id="glowG" cx="82%" cy="-5%" r="55%">
      <stop offset="0" stop-color="#2dd46f" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd46f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="6%" cy="105%" r="55%">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.10"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222c38"/><stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="#0b0f14"/>
  <rect width="1200" height="360" fill="url(#glowG)"/>
  <rect width="1200" height="360" fill="url(#glowA)"/>

  <!-- left: brand + tagline -->
  <rect x="72" y="58" width="60" height="60" rx="16" fill="url(#logoG)"/>
  <text x="102" y="101" font-size="34" font-weight="700" fill="#06250f" text-anchor="middle">P</text>
  <text x="150" y="103" font-size="44" font-weight="700" fill="#e8eef5">Picker</text>

  <text x="74" y="188" font-size="40" font-weight="700" fill="#e8eef5">The paper list, <tspan fill="#2dd46f">replaced.</tspan></text>
  <text x="76" y="226" font-size="19" fill="#8fa1b3">Hands-free order picking on any phone — the earbud is optional.</text>

  <g font-size="14" font-weight="600">
    <rect x="74" y="256" width="196" height="30" rx="15" fill="#141a22" stroke="#243040"/>
    <text x="172" y="276" fill="#8fa1b3" text-anchor="middle">In daily use, every shift</text>
    <rect x="282" y="256" width="232" height="30" rx="15" fill="#141a22" stroke="#243040"/>
    <text x="398" y="276" fill="#8fa1b3" text-anchor="middle">Danish · English · Ukrainian</text>
  </g>

  <!-- right: phone mockup (the real work screen) -->
  <g>
    <rect x="872" y="36" width="256" height="288" rx="34" fill="url(#phoneG)" stroke="#33445a"/>
    <rect x="884" y="48" width="232" height="264" rx="24" fill="#000000"/>
    <text x="900" y="80" font-size="12" fill="#62748a">Store 7445 · Wave 13</text>
    <text x="1100" y="80" font-size="12" fill="#62748a" text-anchor="end">8 / 41</text>
    <text x="1000" y="150" font-size="50" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">002·005</text>
    <rect x="976" y="168" width="48" height="5" rx="2" fill="#2e3946"/>
    <text x="1000" y="214" font-size="30" font-weight="800" fill="#2dd46f" text-anchor="middle">12 stk</text>
    <text x="1000" y="242" font-size="13" fill="#8fa1b3" text-anchor="middle">Arla Letmælk 1L</text>
    <rect x="904" y="262" width="192" height="40" rx="12" fill="#2dd46f"/>
    <text x="1000" y="288" font-size="16" font-weight="800" fill="#06250f" text-anchor="middle">✓ TAKEN</text>
  </g>
</svg>
