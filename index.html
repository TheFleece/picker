<!DOCTYPE html>
<html lang="ru">
<head>
<!--
  PICKER v0.1 — pick-by-voice прототип (личное использование)
  Где что менять:
   • Текст озвучки позиции  -> функция itemPhrase()
   • Парсер листа           -> между метками PARSER_START / PARSER_END
   • Слова-цифры и "штуки"  -> блок "ЧИСЛА -> СЛОВА"
   • Щелчки AirPods         -> блок "AIRPODS"
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<title>Picker v0.1</title>
<style>
  :root{
    --bg:#0b0f14; --card:#141a22; --line:#243040;
    --txt:#e8eef5; --dim:#8fa1b3;
    --go:#2dd46f; --go-press:#24b35d;
    --warn:#ffb020; --bad:#ff5d5d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:12px; padding-bottom:44px;}
  h1{font-size:20px; margin:4px 0 2px;}
  .sub{color:var(--dim); font-size:13px; margin:0 0 14px;}
  textarea{width:100%; min-height:170px; background:var(--card); color:var(--txt);
    border:1px solid var(--line); border-radius:12px; padding:12px; font-size:15px;}
  .btn{display:block; width:100%; border:1px solid var(--line); border-radius:14px;
    padding:16px; font-size:18px; font-weight:600; color:var(--txt);
    background:var(--card); margin-top:10px;}
  .btn:active{transform:scale(.98);}
  .btn-go{background:var(--go); color:#06250f; font-size:26px; padding:24px; border:none;}
  .btn-go:active{background:var(--go-press);}
  .btn-small{padding:11px; font-size:15px; font-weight:500; color:var(--dim);}
  .row{display:flex; gap:10px;}
  .row .btn{flex:1;}
  table{width:100%; border-collapse:collapse; margin-top:12px; font-size:14px;}
  td,th{padding:6px 4px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--dim); font-weight:500; font-size:12px;}
  .num{font-variant-numeric:tabular-nums;}
  .bad-cell{color:var(--bad); font-weight:700;}
  .ok-line{color:var(--go); font-size:15px; margin-top:10px;}
  .warn-line{color:var(--warn); font-size:14px; margin-top:8px;}
  .progress{display:flex; justify-content:space-between; color:var(--dim); font-size:15px; margin:4px 0 8px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 12px; text-align:center;}
  #locBig{font-size:clamp(54px,19vw,100px); font-weight:800; letter-spacing:1px;
    font-variant-numeric:tabular-nums; line-height:1.05;}
  #qtyBig{font-size:clamp(40px,14vw,72px); font-weight:800; color:var(--go); margin-top:2px;}
  #qtyBig.unknown{color:var(--bad);}
  #descTxt{color:var(--dim); font-size:15px; margin-top:10px; min-height:20px; word-break:break-word;}
  #artTxt{color:var(--dim); font-size:14px; margin-top:4px; font-variant-numeric:tabular-nums;}
  .settings{margin-top:14px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px; font-size:15px;}
  .settings label{display:flex; align-items:center; gap:8px; margin:9px 0;}
  .settings input[type=number]{width:64px; font-size:16px; background:var(--bg);
    color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px;}
  .settings input[type=range]{flex:1;}
  .hint{color:var(--dim); font-size:12.5px; line-height:1.45; margin-top:6px;}
  .done-icon{font-size:48px; text-align:center; margin:16px 0 4px;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<!-- ================= ЭКРАН 1: ЗАГРУЗКА ЛИСТА ================= -->
<div id="scrSetup">
  <h1>Picker v0.1</h1>
  <p class="sub">Pick-by-voice · личный прототип</p>

  <textarea id="raw"
    placeholder="Нажми сюда. На клавиатуре появится кнопка сканирования (или удержи палец в поле и выбери «Сканировать текст»). Наведи камеру на ТАБЛИЦУ листа. Вторую страницу можно досканировать в это же поле."></textarea>

  <button class="btn" id="btnParse">Распознать лист</button>
  <div id="parseOut"></div>
  <button class="btn btn-go" id="btnStart" hidden>СТАРТ</button>
</div>

<!-- ================= ЭКРАН 2: РАБОТА ================= -->
<div id="scrWork" hidden>
  <div class="progress">
    <span id="posTxt">1 / 1</span>
    <span id="takenTxt">взято 0 шт</span>
  </div>

  <div class="card">
    <div id="locBig">000-000</div>
    <div id="qtyBig">× 0</div>
    <div id="descTxt"></div>
    <div id="artTxt"></div>
  </div>

  <button class="btn btn-go" id="btnTake">ВЗЯЛ</button>
  <div class="row">
    <button class="btn" id="btnRepeat">Повтор</button>
    <button class="btn" id="btnBack">Назад</button>
  </div>
  <div class="row">
    <button class="btn" id="btnArt">Артикул</button>
    <button class="btn" id="btnSum">Сводка</button>
  </div>

  <div class="settings">
    <label><input type="checkbox" id="repChk" checked>
      Автоповтор каждые <input type="number" id="repSec" value="8" min="3" max="60"> сек</label>
    <label>Скорость речи
      <input type="range" id="rate" min="0.7" max="1.4" step="0.05" value="1.0"></label>
    <label><input type="checkbox" id="podChk">
      Щелчки AirPods (экспериментально)</label>
    <div class="hint">1 щелчок по ножке = ВЗЯЛ · 2 щелчка = Повтор · 3 = Назад.<br>
      Вынутый из уха наушник может сработать как «Взял». Несовместимо с фоновой музыкой.</div>
  </div>

  <button class="btn btn-small" id="btnFinish">Закончить и показать итог</button>
  <button class="btn btn-small" id="btnEdit">✎ Назад к списку</button>
</div>

<!-- ================= ЭКРАН 3: ИТОГ ================= -->
<div id="scrDone" hidden>
  <div class="done-icon">✅</div>
  <h1 style="text-align:center" id="doneHead">Лист готов</h1>
  <p class="sub" style="text-align:center" id="doneSub"></p>
  <div id="doneTable"></div>
  <button class="btn" id="btnSayAll">🔊 Озвучить весь итог</button>
  <button class="btn" id="btnNew">Новый лист</button>
</div>

<script>
'use strict';

/* ================= СОСТОЯНИЕ ================= */
let items = [];        // [{loc, qty, article, desc, taken}]
let idx = 0;           // текущая позиция
let inWork = false;    // мы на рабочем экране?
let repeatTimer = null;

const $ = id => document.getElementById(id);

/* ================= ПАРСЕР ================= */
// ===PARSER_START===
// Логика: локация вида 003-002 = начало новой позиции.
// Внутри блока: 8 цифр подряд = артикул; первое отдельное число
// из 1-2 цифр ДО артикула = количество (запасной вариант — сразу после).
// Остальное (после артикула) = описание, максимум 8 слов.
function parseList(raw){
  const text = String(raw).replace(/\u00A0/g, ' ');
  const found = Array.from(text.matchAll(/\b\d{3}-\d{3}\b/g));
  const out = [];
  for (let i = 0; i < found.length; i++){
    const m = found[i];
    const segStart = m.index + m[0].length;
    const segEnd = (i + 1 < found.length) ? found[i + 1].index : text.length;
    const tokens = text.slice(segStart, segEnd).split(/\s+/).filter(Boolean);

    let article = null, qty = null;
    const artIdx = tokens.findIndex(t => /^\d{8}$/.test(t));
    if (artIdx !== -1) article = tokens[artIdx];

    // количество: первое "чистое" число 1-2 цифры до артикула
    let qtyIdx = -1;
    const limit = (artIdx !== -1) ? artIdx : tokens.length;
    for (let j = 0; j < limit; j++){
      if (/^\d{1,2}$/.test(tokens[j])) { qtyIdx = j; break; }
    }
    // запасной вариант: OCR мог поставить qty сразу после артикула
    if (qtyIdx === -1 && artIdx !== -1){
      for (let j = artIdx + 1; j < Math.min(tokens.length, artIdx + 3); j++){
        if (/^\d{1,2}$/.test(tokens[j])) { qtyIdx = j; break; }
      }
    }
    if (qtyIdx !== -1) qty = parseInt(tokens[qtyIdx], 10);

    // описание: всё после артикула, кроме самого артикула и qty
    const desc = [];
    for (let j = 0; j < tokens.length; j++){
      if (j === artIdx || j === qtyIdx) continue;
      if (artIdx !== -1 && j < artIdx) continue;   // мусор до артикула пропускаем
      desc.push(tokens[j]);
      if (desc.length >= 8) break;
    }
    out.push({ loc: m[0], qty: qty, article: article, desc: desc.join(' '), taken: false });
  }
  return out;
}
// ===PARSER_END===

/* ================= ЧИСЛА -> СЛОВА ================= */
const DIGITS = ['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять'];

// "003-002" -> "ноль три, ноль два"  (ведущую цифру 0 убираем: 003 -> 03)
function locToSpeech(loc){
  return loc.split('-').map(function(g){
    const short = g.replace(/^0/, '');
    return short.split('').map(d => DIGITS[+d]).join(' ');
  }).join(', ');
}

// количество в винительном падеже: "одну", "две", "три"...
const QTY_WORDS = {1:'одну',2:'две',3:'три',4:'четыре',5:'пять',6:'шесть',7:'семь',
  8:'восемь',9:'девять',10:'десять',11:'одиннадцать',12:'двенадцать',13:'тринадцать',
  14:'четырнадцать',15:'пятнадцать',16:'шестнадцать',17:'семнадцать',18:'восемнадцать',
  19:'девятнадцать',20:'двадцать'};
function qtyToSpeech(n){ return QTY_WORDS[n] || String(n); }

function shtuk(n){
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return 'штуку';
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'штуки';
  return 'штук';
}

// "11241568" -> "11 24 15 68" (озвучивается парами — быстрее и понятнее)
function articleToSpeech(a){
  return a ? a.replace(/(\d\d)(?=\d)/g, '$1 ') : 'артикул не распознан';
}

// >>> ФОРМАТ ОЗВУЧКИ ПОЗИЦИИ — менять тут <<<
function itemPhrase(it){
  const q = (it.qty != null)
    ? 'Взять ' + qtyToSpeech(it.qty) + ' ' + shtuk(it.qty) + '.'
    : 'Количество не распознано, посмотри на экран.';
  return 'Локация ' + locToSpeech(it.loc) + '. ' + q;
}

/* ================= ОЗВУЧКА (TTS) ================= */
let ruVoice = null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  ruVoice = vs.find(v => /^ru/i.test(v.lang) && /milena/i.test(v.name))
         || vs.find(v => /^ru/i.test(v.lang)) || null;
}
if (window.speechSynthesis){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}

function speak(text){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  if (ruVoice) u.voice = ruVoice;
  u.rate = parseFloat($('rate').value) || 1;
  // небольшая пауза после cancel() — известный глюк iOS
  setTimeout(function(){ speechSynthesis.speak(u); }, 60);
  scheduleRepeat();
}

// очередь фраз (для длинной сводки)
function speakSeq(arr){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  setTimeout(function(){
    arr.forEach(function(t){
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'ru-RU';
      if (ruVoice) u.voice = ruVoice;
      u.rate = parseFloat($('rate').value) || 1;
      speechSynthesis.speak(u);
    });
  }, 60);
}

/* ================= АВТОПОВТОР ================= */
function scheduleRepeat(){
  clearTimeout(repeatTimer);
  if (!inWork || !$('repChk').checked) return;
  const sec = Math.max(3, parseInt($('repSec').value, 10) || 8);
  repeatTimer = setTimeout(function(){ sayItem(); }, sec * 1000);
}

/* ================= ЛОГИКА СБОРКИ ================= */
function render(){
  const it = items[idx];
  $('posTxt').textContent = (idx + 1) + ' / ' + items.length;
  const takenSum = items.filter(i => i.taken).reduce((s, i) => s + (i.qty || 0), 0);
  $('takenTxt').textContent = 'взято ' + takenSum + ' шт';
  $('locBig').textContent = it.loc;
  if (it.qty != null){
    $('qtyBig').textContent = '× ' + it.qty;
    $('qtyBig').classList.remove('unknown');
  } else {
    $('qtyBig').textContent = '× ?';
    $('qtyBig').classList.add('unknown');
  }
  $('descTxt').textContent = it.desc || '';
  $('artTxt').textContent = it.article ? ('Артикул: ' + it.article) : 'Артикул не распознан';
}

function sayItem(){ render(); speak(itemPhrase(items[idx])); }

function take(){
  items[idx].taken = true;
  beep(880, 90);
  if (idx + 1 < items.length){ idx++; sayItem(); }
  else { finish(); }
}

function back(){
  if (idx > 0){ idx--; items[idx].taken = false; }
  beep(440, 90);
  sayItem();
}

function midSummary(){
  const done = items.filter(i => i.taken);
  const sum = done.reduce((s, i) => s + (i.qty || 0), 0);
  speak('Взято ' + done.length + ' из ' + items.length + ' позиций. Всего ' + sum + ' штук.');
}

function finish(){
  inWork = false;
  clearTimeout(repeatTimer);
  $('scrWork').hidden = true;
  $('scrDone').hidden = false;
  const taken = items.filter(i => i.taken);
  const sum = taken.reduce((s, i) => s + (i.qty || 0), 0);
  $('doneSub').textContent = taken.length + ' позиций · ' + sum + ' штук — сверь с Total coli на листе';
  let html = '<table><tr><th>Локация</th><th>Qty</th><th>✓</th></tr>';
  items.forEach(function(it){
    html += '<tr><td class="num">' + it.loc + '</td><td class="num">' +
      (it.qty != null ? it.qty : '?') + '</td><td>' + (it.taken ? '✅' : '—') + '</td></tr>';
  });
  html += '</table>';
  $('doneTable').innerHTML = html;
  beep(880, 80); setTimeout(function(){ beep(1320, 120); }, 140);
  speak('Лист готов. ' + taken.length + ' позиций, ' + sum + ' штук. Сверь с бумагой.');
}

function sayAll(){
  const phrases = ['Итог по листу.'];
  items.forEach(function(it){
    if (it.taken) phrases.push(locToSpeech(it.loc) + ' — ' + (it.qty != null ? it.qty : 'не распознано') + '.');
  });
  speakSeq(phrases);
}

/* ================= WAKE LOCK (экран не гаснет) ================= */
let wakeLock = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
  catch(e){ /* не критично */ }
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && inWork) keepAwake();
});

/* ================= БИП (подтверждение действия) ================= */
let actx = null;
function ensureAudio(){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); 
        if (actx.state === 'suspended') actx.resume(); } catch(e){}
}
function beep(freq, ms){
  try {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.12, actx.currentTime);
    o.start(); o.stop(actx.currentTime + ms / 1000);
  } catch(e){}
}

/* ================= AIRPODS (щелчки по ножке) ================= */
// Хитрость: крутим в фоне беззвучный WAV — тогда iOS считает страницу
// «плеером» и щелчки по ножке AirPods приходят как медиа-команды.
function silentWavURL(){
  const rate = 8000, len = rate * 2;             // 2 секунды тишины
  const buf = new ArrayBuffer(44 + len * 2);
  const v = new DataView(buf);
  const ws = function(o, s){ for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, 'data'); v.setUint32(40, len * 2, true);   // сэмплы = нули
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

let pod = null, podGuard = 0;
function stemAction(kind){
  if (!inWork) return;
  const now = Date.now();
  if (now < podGuard) return;          // защита от двойного срабатывания
  podGuard = now + 300;
  if (kind === 'take') take();
  else if (kind === 'repeat') sayItem();
  else back();
}

async function podToggle(on){
  if (on){
    if (!pod){
      pod = new Audio(silentWavURL());
      pod.loop = true;
      pod.volume = 0.01;
      pod.addEventListener('pause', function(){
        if ($('podChk').checked){ stemAction('take'); pod.play(); }
      });
    }
    try { await pod.play(); } catch(e){
      alert('Не удалось включить аудио-канал. Попробуй ещё раз.');
      $('podChk').checked = false; return;
    }
    if ('mediaSession' in navigator){
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: 'Picker · щелчок = Взял' });
        navigator.mediaSession.setActionHandler('pause', function(){ stemAction('take'); pod.play(); });
        navigator.mediaSession.setActionHandler('play',  function(){ stemAction('take'); pod.play(); });
        navigator.mediaSession.setActionHandler('nexttrack', function(){ stemAction('repeat'); });
        navigator.mediaSession.setActionHandler('previoustrack', function(){ stemAction('back'); });
      } catch(e){}
    }
  } else if (pod){
    pod.pause();
  }
}

/* ================= ЭКРАН 1: РАСПОЗНАВАНИЕ ================= */
function doParse(){
  items = parseList($('raw').value);
  const out = $('parseOut');
  if (!items.length){
    out.innerHTML = '<p class="warn-line">Не нашёл ни одной локации вида 003-002. ' +
      'Проверь, что отсканировалась таблица.</p>';
    $('btnStart').hidden = true;
    return;
  }
  const sum = items.reduce((s, i) => s + (i.qty || 0), 0);
  const bad = items.filter(i => i.qty == null || !i.article).length;
  let html = '<table><tr><th>Локация</th><th>Qty</th><th>Артикул</th><th>Описание</th></tr>';
  items.forEach(function(it){
    html += '<tr><td class="num">' + it.loc + '</td>' +
      '<td class="num' + (it.qty == null ? ' bad-cell' : '') + '">' + (it.qty != null ? it.qty : '?') + '</td>' +
      '<td class="num' + (!it.article ? ' bad-cell' : '') + '">' + (it.article || '?') + '</td>' +
      '<td>' + (it.desc || '') + '</td></tr>';
  });
  html += '</table>';
  html += '<p class="ok-line">Позиций: ' + items.length + ' · Сумма Qty: <b>' + sum +
    '</b> — сверь с «Total coli» на листе.</p>';
  if (bad) html += '<p class="warn-line">⚠️ ' + bad +
    ' позиций распознались не полностью. Поправь текст в поле выше и нажми «Распознать» ещё раз.</p>';
  out.innerHTML = html;
  $('btnStart').hidden = false;
}

function startWork(){
  if (!items.length) return;
  idx = 0;
  items.forEach(function(i){ i.taken = false; });
  inWork = true;
  $('scrSetup').hidden = true;
  $('scrDone').hidden = true;
  $('scrWork').hidden = false;
  ensureAudio();      // разрешаем бипы (нужен жест пользователя)
  pickVoice();
  keepAwake();
  sayItem();
}

/* ================= ПРИВЯЗКА КНОПОК ================= */
$('btnParse').addEventListener('click', doParse);
$('btnStart').addEventListener('click', startWork);
$('btnTake').addEventListener('click', take);
$('btnRepeat').addEventListener('click', sayItem);
$('btnBack').addEventListener('click', back);
$('btnArt').addEventListener('click', function(){ speak(articleToSpeech(items[idx].article)); });
$('btnSum').addEventListener('click', midSummary);
$('btnFinish').addEventListener('click', finish);
$('btnEdit').addEventListener('click', function(){
  inWork = false; clearTimeout(repeatTimer);
  $('scrWork').hidden = true; $('scrSetup').hidden = false;
});
$('btnSayAll').addEventListener('click', sayAll);
$('btnNew').addEventListener('click', function(){ location.reload(); });
$('podChk').addEventListener('change', function(e){ podToggle(e.target.checked); });
$('repChk').addEventListener('change', scheduleRepeat);
$('repSec').addEventListener('change', scheduleRepeat);
</script>
</body>
</html>
